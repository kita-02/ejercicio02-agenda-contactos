<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 02 - Agenda de Contactos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contenedor">
      <h1>Agenda de Contactos</h1>
      <p class="subtitulo">Ejercicio 02 - Desarrollo con Git y GitHub mediante funcionalidades</p>

      <!-- Formulario de registro (feature-agregar-contacto) -->
      <section class="formulario" id="formulario">
        <h2>Registrar contacto</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Nombre del contacto" />

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" placeholder="987654321" />

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" />

        <button type="button" onclick="guardarContacto()">Agregar contacto</button>
        <p id="mensaje"></p>
      </section>

      <!-- Lista de contactos (feature-listar-contactos) -->
      <section class="lista">
        <h2>Mis contactos <span class="contador" id="total">0</span></h2>

        <div class="buscador">
          <input type="text" id="buscar" placeholder="Buscar contacto por nombre" />
        </div>

        <ul id="listaContactos"></ul>
        <p id="vacio" class="vacio">No hay contactos registrados.</p>
      </section>

      <!-- Detalle del contacto (feature-eliminar-contacto) -->
      <section class="detalle" id="detalle"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
